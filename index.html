<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChiAnStudioDev</title>
<meta name="description" content="ChiAnStudioDev - indie mobile games.">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2330; --muted:#5b6474; --accent:#3b6cf6; --line:#e3e6ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#9aa3b2; --accent:#7c9cff; --line:#2a303b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .sub { color:var(--muted); margin:0 0 32px; }
  h2 { font-size:1.15rem; margin:32px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h3 { margin:0 0 6px; }
  .card p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .links a { margin-right:16px; display:inline-block; }
  footer { margin-top:40px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>ChiAnStudioDev</h1>
  <p class="sub">Indie mobile games from Vietnam.</p>

  <h2>Our games</h2>
  <div class="card">
    <h3>War Collect Pet</h3>
    <p>Collect, merge and battle cute pets across island campaigns.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.chianstudiodev.warcolectpet">Google Play</a>
      <a href="warcolectpet-privacy.html">Privacy Policy</a>
    </div>
  </div>
  <div class="card">
    <h3>Gemkin</h3>
    <div class="links">
      <a href="gemkin-privacy.html">Privacy Policy</a>
    </div>
  </div>

  <h2>Contact</h2>
  <p>Support: <a href="mailto:chianstudiodev@gmail.com">chianstudiodev@gmail.com</a></p>

  <footer>&copy; 2026 ChiAnStudioDev</footer>
</main>
</body>
</html>
